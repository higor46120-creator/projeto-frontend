name: CI React Docker

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Build da aplicação React
  build-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependências
        run: npm install

      - name: Build do Projeto
        run: npm run build

  # Job 2: Construção e Push da Imagem Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: build-react
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: docker build -t fiecpa2026 .

      - name: Tag e Push da Imagem
        run: |
          docker tag fiecpa2026 ${{ secrets.DOCKER_USERNAME }}/helptech:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/helptech:latest

  # Job 3: Rodando na AWS
  deploy-ec2:
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Forçar Pull da imagem nova
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/helptech:latest

      - name: Parar e remover container antigo
        run: |
          docker stop react-app || true
          docker rm react-app || true

      - name: Rodar novo container com flag de pull
        run: |
          docker run -d --pull always --name react-app -p 80:80 ${{ secrets.DOCKER_USERNAME }}/helptech:latest
